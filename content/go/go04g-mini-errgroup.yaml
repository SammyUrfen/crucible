      reference_solution: |
        package crucible

        import "sync"

        // Group is a mini-errgroup: completion owned by a WaitGroup, first error
        // captured by a Once latch. This is the core of x/sync/errgroup minus
        // context cancellation.
        type Group struct {
        	wg   sync.WaitGroup
        	once sync.Once
        	err  error
        }

        // Go runs f in its own goroutine and registers it with the group. Add runs
        // here, in the caller's goroutine: Add concurrent with Wait is a WaitGroup
        // misuse, and program order makes this placement safe.
        func (g *Group) Go(f func() error) {
        	g.wg.Add(1)
        	go func() {
        		defer g.wg.Done()
        		if err := f(); err != nil {
        			// Exactly one writer wins; later failures are no-ops. The
        			// lockless read in Wait is safe because err is written before
        			// wg.Done() and read after wg.Wait() — a happens-before edge.
        			g.once.Do(func() { g.err = err })
        		}
        	}()
        }

        // Wait blocks until every function started with Go has returned, then
        // returns the first captured error, or nil if every function succeeded.
        func (g *Group) Wait() error {
        	g.wg.Wait()
        	return g.err
        }
      test_code: |
        package crucible

        import (
        	"errors"
        	"sync/atomic"
        	"testing"
        	"time"
        )

        // Deadline for "a blocking wait must eventually deliver" checks — generous
        // so a loaded box cannot flake it (PILOT-CONVENTIONS: ~2 s).
        const testDeadline = 2 * time.Second

        func TestAllSucceed(t *testing.T) {
        	var g Group
        	var ran atomic.Int64
        	const n = 8
        	for i := 0; i < n; i++ {
        		g.Go(func() error {
        			ran.Add(1)
        			return nil
        		})
        	}
        	if err := g.Wait(); err != nil {
        		t.Fatalf("Wait = %v, want nil when every function succeeds", err)
        	}
        	if got := ran.Load(); got != int64(n) {
        		t.Fatalf("only %d of %d functions ran — Go must start every f", got, n)
        	}
        }

        func TestFirstErrorWins(t *testing.T) {
        	var g Group
        	start := make(chan struct{})
        	submitted := []error{
        		errors.New("dial stun0: i/o timeout"),
        		errors.New("dial stun1: connection refused"),
        		errors.New("dial turn0: 401 unauthorized"),
        	}
        	for _, e := range submitted {
        		g.Go(func() error {
        			<-start // barrier: the three failures race to be captured
        			return e
        		})
        	}
        	for i := 0; i < 5; i++ {
        		g.Go(func() error {
        			<-start
        			return nil
        		})
        	}
        	close(start)
        	got := g.Wait()
        	if got == nil {
        		t.Fatal("Wait = nil, but 3 of 8 functions returned an error")
        	}
        	// Which failure wins is scheduling-dependent — any submitted error is
        	// a correct answer; asserting a specific one would be unsound.
        	for _, e := range submitted {
        		if errors.Is(got, e) {
        			return
        		}
        	}
        	t.Fatalf("Wait = %v, which is not one of the 3 submitted errors", got)
        }

        func TestWaitsForAll(t *testing.T) {
        	var g Group
        	var slowFinished atomic.Bool
        	release := make(chan struct{})
        	errBoom := errors.New("fast candidate: connection refused")
        	g.Go(func() error {
        		return errBoom // fails immediately
        	})
        	g.Go(func() error {
        		<-release // provably unfinished until the test says so
        		slowFinished.Store(true)
        		return nil
        	})
        	waitDone := make(chan error, 1)
        	go func() { waitDone <- g.Wait() }()
        	// A correct Wait CANNOT return yet: the slow function is parked on
        	// release, which is still open. The 100 ms window below exists only to
        	// catch a Wait that returns on first error; correct code never sends in
        	// this window, so the window cannot flake a correct solution.
        	select {
        	case err := <-waitDone:
        		t.Fatalf("Wait returned %v while a started function was still running — the first error must not abandon in-flight goroutines", err)
        	case <-time.After(100 * time.Millisecond):
        	}
        	close(release)
        	select {
        	case err := <-waitDone:
        		if !slowFinished.Load() {
        			t.Fatal("Wait returned before the slow function finished")
        		}
        		if !errors.Is(err, errBoom) {
        			t.Fatalf("Wait = %v, want the one submitted error %v", err, errBoom)
        		}
        	case <-time.After(testDeadline):
        		t.Fatal("Wait did not return within 2s after every function finished")
        	}
        }
      tests:
        - { name: TestAllSucceed,     visible: true,  golden: "Wait returns nil after all 8 succeed; an atomic count proves every f actually ran" }
        - { name: TestFirstErrorWins, visible: false, golden: "with 3 concurrent failures behind a barrier, Wait returns one of the submitted errors, never nil" }
        - { name: TestWaitsForAll,    visible: false, golden: "Wait blocks while a slow success is in flight and still reports the early error after it finishes" }
      race: true
      timeout_ms: 10000

  - id: go04g-a4
    type: explain_tradeoff
    covers: [go04g-o3]
    difficulty: hard
    prompt: |
      In writing, assign the completion+failure machinery for three conclave-shaped
      fan-outs, and defend the first choice against both rejected alternatives:

      (a) bootstrap dial round — 8 STUN/TURN candidates dialed concurrently; the first
          failure decides the round, but every dialer must still release its socket before
          the next round may start;
      (b) upload-meter sampling — one sampler per peer, each stores a reading into an
          atomic; a sampler cannot fail;
      (c) candidate validation — the operator report must list EVERY failing candidate,
          not just the first.

      For (a), name both rejected alternatives (bare WaitGroup + shared err variable;
      single-receive error channel), give each one's concrete failure mode, and include at
      least one number somewhere in your answer.
    grading:
      strategy: llm_judge
      judge_mode: rubric
      rubric:
        pass_threshold: 0.6
        criteria:
          - { id: c1, weight: 0.4, text: "Correct primitive per shape — (a) Group/errgroup-shape, (b) bare WaitGroup with no error latch, (c) cap-N channel or mutex+slice collected via errors.Join — and names both rejected alternatives for (a)" }
          - { id: c2, weight: 0.3, text: "Concrete failure modes: -race read/write report on the shared err variable; parked senders leaking goroutines or a zero-failure/mis-drained deadlock on the channel; first-error latch discarding the other k-1 diagnoses in (c)" }
          - { id: c3, weight: 0.3, text: "Includes a quantified claim (leaked-goroutine count, ~KB per parked goroutine, buffer-capacity arithmetic, or a measured overhead/trip-rate number)" }
        anti_reward_hacking: { min_words: 40, penalize_if_contains: ["as an AI", "it depends"] }
    reference_answer: |
      (a) is the errgroup shape — the first non-nil error is the verdict, completion is
      all-8 — so: a Group with a WaitGroup for completion and a sync.Once latch for the
      error (x/sync/errgroup itself once cancellation via context is also wanted).
      Rejected: bare WaitGroup + shared err is an unsynchronized check-then-assign, and go
      test -race prints a read/write pair on the err variable between two failing dialers;
      a single-receive unbuffered error channel parks every failing dialer after the first
      inside its send — with k=3 failures that is 2 goroutines (~2 KB of initial stack
      each) parked mid-cleanup, their deferred wg.Done() never runs, and the round
      deadlocks; with 0 failures the bare receive deadlocks instead. (b) samplers cannot
      fail, so a bare WaitGroup is the complete answer; an error latch adds a field and a
      branch that document a failure path that cannot happen. (c) needs all k errors: a
      results channel with cap 8 — one slot per candidate, so no sender can ever park —
      drained to completion and folded with errors.Join (or a mutex-guarded slice). A
      first-error latch there throws away k-1 of the k diagnoses the operator asked for.

limitations: >
  TestFirstErrorWins proves Wait returns SOME submitted error, not WHICH one — under truly
  concurrent failures "first" is unobservable from outside, so an always-overwrite mutex
  latch passes these behavioral tests too (its observable contract is identical).
  TestWaitsForAll's 100 ms window catches an early-returning Wait with near-certainty, not
  certainty: a wrong implementation that dawdles longer than 100 ms before returning would
  slip through, while correct code cannot flake the window in either direction by
  construction. A green -race run remains a probabilistic absence of observed races (R4).
  And this Group deliberately omits errgroup's WithContext and SetLimit — after a failure,
  sibling tasks here run to completion rather than being cancelled, which is exactly the
  gap x/sync/errgroup's context integration exists to close.
